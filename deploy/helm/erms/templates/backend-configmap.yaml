apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "erms.backend.fullname" . }}
  labels:
    {{- include "erms.labels" (dict "ctx" $ "component" "backend" "version" .Values.backend.image.tag) | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: {{ include "erms.datasourceUrl" . | quote }}
  SPRING_DATASOURCE_USERNAME: {{ default .Values.mysql.username .Values.backend.datasource.username | quote }}
  {{- with .Values.backend.profiles }}
  SPRING_PROFILES_ACTIVE: {{ . | quote }}
  {{- end }}
  ERMS_API_DOCS_ENABLED: {{ .Values.backend.apiDocsEnabled | toString | quote }}
  {{- with .Values.backend.corsAllowedOrigins }}
  ERMS_CORS_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  ERMS_JWT_TTL: {{ .Values.backend.jwt.ttl | quote }}
  ERMS_JWT_ISSUER: {{ .Values.backend.jwt.issuer | quote }}
  ERMS_TIME_ZONE: {{ .Values.backend.timeZone | quote }}
