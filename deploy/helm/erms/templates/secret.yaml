{{- if not .Values.secrets.existingSecret }}
{{- /*
Chart-managed secret. Values are generated once and then reused on every upgrade via
`lookup`, so passwords and the JWT key stay stable. resource-policy keep means
`helm uninstall` leaves it in place (it matches the data on the kept PVC).
Note: `helm template` / client-side dry-runs cannot lookup, so they render fresh random values.
*/}}
{{- $name := include "erms.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "erms.labels" (dict "ctx" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mysql-root-password: {{ get $data "mysql-root-password" | default (randAlphaNum 24 | b64enc) | quote }}
  mysql-password: {{ get $data "mysql-password" | default (randAlphaNum 24 | b64enc) | quote }}
  jwt-secret: {{ get $data "jwt-secret" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
