apiVersion: v1
kind: Service
metadata:
  name: {{ include "erms.backend.fullname" . }}
  labels:
    {{- include "erms.labels" (dict "ctx" $ "component" "backend" "version" .Values.backend.image.tag) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "erms.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # Management (actuator) port: cluster-internal only, never routed by the Ingress.
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
