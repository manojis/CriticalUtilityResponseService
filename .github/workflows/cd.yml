# CD: deploy to Rancher Desktop (k3s) on the developer Mac through a self-hosted runner.
#
# SECURITY (public repository): this is the ONLY workflow that targets the self-hosted runner.
# It must never gain a pull_request / pull_request_target trigger. It runs only for
#   - a successful CI run triggered by a push to main of THIS repository (workflow_run), or
#   - a manual dispatch on main by someone with write access.
# The environment "local" additionally only accepts deployments from main, and every deployment
# waits for an approval by the repository owner (required reviewer).
#
# The runner is the unprivileged macOS user _ermsrunner (scripts/setup-local-runner.sh). It has no
# docker socket; k3s pulls the public GHCR images by SHA. Its kubeconfig (context rancher-desktop)
# is the ServiceAccount erms/erms-deployer, limited to namespace erms (deploy/runner/deployer-rbac.yaml).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (git sha). Empty = the commit this run is on."
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-local:
    name: Deploy to Rancher Desktop
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, rancher-desktop]
    environment:
      name: local
      url: http://erms.localhost
    concurrency:
      group: deploy-local
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      KUBE_CONTEXT: rancher-desktop
      NAMESPACE: erms
      RELEASE: erms
      CHART: deploy/helm/erms
      BASE_URL: http://erms.localhost
      HELM_TIMEOUT: 10m
    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Note: macOS /bin/bash is 3.2. Keep run steps free of bash 4+ features.
      - name: Resolve image tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${HEAD_SHA:-$GITHUB_SHA}}"
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::invalid image tag '$TAG'"
            exit 1
          fi
          {
            echo "TAG=$TAG"
            echo "IMAGE_REGISTRY=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_ENV"
          echo "Deploying tag $TAG"

      # The namespace (Pod Security "restricted") is created once by scripts/setup-local-runner.sh;
      # the runner identity cannot create namespaces or touch anything outside it.
      - name: Preflight
        run: |
          set -euo pipefail
          kubectl version --context "$KUBE_CONTEXT"
          helm version --short
          if [[ "$(kubectl --context "$KUBE_CONTEXT" auth can-i create deployments -n "$NAMESPACE" 2>/dev/null)" != yes ]]; then
            echo "::error::runner identity cannot deploy to namespace $NAMESPACE; re-run 'make runner-setup' on the Mac"
            exit 1
          fi

      - name: helm upgrade --install
        run: |
          set -euo pipefail
          # Helm 4 renamed --atomic to --rollback-on-failure.
          if helm version --short | grep -q '^v3\.'; then ROLLBACK_FLAG=--atomic; else ROLLBACK_FLAG=--rollback-on-failure; fi
          helm upgrade --install "$RELEASE" "$CHART" \
            --kube-context "$KUBE_CONTEXT" -n "$NAMESPACE" \
            -f "$CHART/values-local.yaml" \
            --set imageRegistry="$IMAGE_REGISTRY" \
            --set backend.image.tag="$TAG" \
            --set frontend.image.tag="$TAG" \
            "$ROLLBACK_FLAG" --wait --timeout "$HELM_TIMEOUT"

      - name: helm test
        run: helm test "$RELEASE" -n "$NAMESPACE" --kube-context "$KUBE_CONTEXT" --logs --timeout 5m

      - name: Smoke test
        run: scripts/smoke-test.sh "$BASE_URL"

      - name: Diagnostics
        if: failure()
        run: scripts/diagnostics.sh --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" --release "$RELEASE"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed ERMS to Rancher Desktop"
            echo "- Image tag: \`$TAG\`"
            echo "- URL: $BASE_URL"
            echo '```'
            helm history "$RELEASE" -n "$NAMESPACE" --kube-context "$KUBE_CONTEXT" --max 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
