spring:
  application:
    name: erms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/erms?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:erms}
    # SPRING_DATASOURCE_PASSWORD is required and bound by Spring's relaxed binding (no default on purpose).
    hikari:
      pool-name: erms-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${ERMS_API_DOCS_ENABLED:false}
    path: /api/openapi
  swagger-ui:
    enabled: ${ERMS_API_DOCS_ENABLED:false}
    path: /api/docs
  paths-to-match: /api/v1/**

erms:
  jwt:
    # ERMS_JWT_SECRET is required (>= 32 bytes); startup fails fast without it.
    secret: ${ERMS_JWT_SECRET:}
    ttl: ${ERMS_JWT_TTL:PT1H}
    issuer: ${ERMS_JWT_ISSUER:erms}
  cors:
    allowed-origins: ${ERMS_CORS_ALLOWED_ORIGINS:}
  time-zone: ${ERMS_TIME_ZONE:UTC}
  api-docs-enabled: ${ERMS_API_DOCS_ENABLED:false}

---
# Structured JSON (ECS) console logs everywhere except the human-friendly local and test profiles.
spring:
  config:
    activate:
      on-profile: "!local & !test"
logging:
  structured:
    format:
      console: ecs
