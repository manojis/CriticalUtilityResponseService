# ERMS frontend — main nginx config (replaces the base image's /etc/nginx/nginx.conf).
#
# Designed for a read-only root filesystem: everything nginx writes at runtime lives under /tmp
# (pid file, temp paths, and the server config rendered from the template at start-up).

worker_processes auto;

error_log /dev/stderr notice;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Propagate the caller's X-Request-Id, or generate one, so logs correlate with the backend.
    map $http_x_request_id $erms_request_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    # One JSON object per line; request_id matches the X-Request-Id forwarded to the backend.
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
                                '"request_id":"$erms_request_id","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"upstream_status":"$upstream_status",'
                                '"referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    # Rendered by /docker-entrypoint.d/20-envsubst-on-templates.sh from
    # /etc/nginx/templates/default.conf.template (NGINX_ENVSUBST_OUTPUT_DIR=/tmp).
    # Explicit path: if rendering failed, nginx refuses to start instead of serving nothing.
    include /tmp/default.conf;
}
